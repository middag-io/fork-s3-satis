name: Build PHAR Archive

# CI de branch e PR: compila o PHAR e guarda como artifact, para inspeção.
# Publicação é do `release.yml`, disparado por tag `v*` — aqui não se publica
# nada. Antes os dois viviam neste arquivo e a tag caía nos dois caminhos.
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # PHP 8.4 é piso, não preferência: `composer/satis` dev-main exige
      # `php: ^8.4`, e é dele que vem o `composer/composer` >= 2.10 — a versão
      # que removeu a validação de charset do `github-oauth`.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-check-all

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      # `--no-dev` reproduz o que o release faz: com dev deps o `laravel/pint`
      # (22 MB) entra no PHAR e ele triplica de tamanho. Buildar diferente do
      # release esconderia justamente esse tipo de divergência.
      - name: Install dependencies (no-dev)
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: Build PHAR
        run: |
          php s3-satis app:build --build-version="$(git rev-parse --short "$GITHUB_SHA")" --no-interaction
          mv builds/s3-satis builds/s3-satis.phar
          ls -l builds/s3-satis.phar

      - name: Smoke — Composer embutido aceita token com hífen
        run: |
          set -euo pipefail
          # O `build` do satis morre na primeira linha se o Composer embutido
          # recusar o `config.github-oauth`, e ele recusava qualquer token com
          # hífen até a 2.10.0. Como o satis roda com `--skip-errors`, o job do
          # consumidor ficava VERDE nesse cenário e o índice congelava em
          # silêncio. Esta trava impede a regressão voltar num bump de dep.
          cat > /tmp/tok-test.php <<'PHP'
          <?php
          require 'phar://'.$argv[1].'/vendor/autoload.php';
          $config = new Composer\Config(false);
          $config->merge(['config' => ['github-oauth' => ['github.com' => 'ghs_15abc-def_GHI.jkl']]]);
          (new Composer\IO\NullIO())->loadConfiguration($config);
          echo "ok\n";
          PHP
          php /tmp/tok-test.php "$PWD/builds/s3-satis.phar" \
            || { echo "::error::o Composer embutido recusa token com hífen — PHAR inutilizável para GitHub App" >&2; exit 1; }

          php -r '
            $s = file_get_contents("phar://".$argv[1]."/vendor/composer/composer/src/Composer/Composer.php");
            preg_match("/VERSION = \x27([^\x27]+)/", $s, $m);
            $v = $m[1] ?? "?";
            echo "Composer embutido: $v\n";
            if (version_compare($v, "2.10.0", "<")) {
              fwrite(STDERR, "::error::Composer embutido $v < 2.10.0\n");
              exit(1);
            }
          ' "$PWD/builds/s3-satis.phar"

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: builds/*
          if-no-files-found: error
          retention-days: 30
